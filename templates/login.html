{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block public_content %}
<section class="container auth-wrap">
    <div class="auth-card mx-auto">
        <div class="text-center mb-4">
            <span class="brand-mark lg"><i class="bi bi-flower1"></i></span>
            <h1 class="h3 fw-bold mt-3 mb-1">Welcome back</h1>
            <p class="text-muted">Log in to see your wellness dashboard.</p>
        </div>
        <form method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
                <div class="invalid-feedback">Please enter your email.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
                <div class="invalid-feedback">Please enter your password.</div>
            </div>
            <button type="submit" class="btn btn-brand w-100 btn-lg">Log in</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0">New to ZenFlow? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</section>
{% endblock %}
